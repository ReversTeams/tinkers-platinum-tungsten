plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = mod_version
group = 'net.reversteam.tinkersplatinumtungsten'
base { archivesName = mod_id + '-neoforge' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
neoForge {
    version = neo_version
    runs { client { client() }; server { server(); programArgument '--nogui' } }
    mods { tinkersplatinumtungsten { sourceSet sourceSets.main } }
}
repositories { maven { url = 'https://api.modrinth.com/maven' } }
dependencies {
    runtimeOnly 'maven.modrinth:3xgZFdrY:SbT1iise'
}
tasks.named('processResources', ProcessResources) {
    def props = project.properties.findAll { k,v -> k.startsWith('mod_') || k in ['minecraft_version_range','neo_version_range'] }
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}
tasks.named('jar') { from('LICENSE') }
